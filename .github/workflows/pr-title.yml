# With squash merge the pull request title becomes the commit on main, so it
# must be a Conventional Commit. Also warns when no issue is linked.
name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - name: Title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if ! printf '%s' "$TITLE" | grep -Eq "$pattern"; then
            echo "::error::The title must be a Conventional Commit, e.g. 'feat(skills): export packs' or 'fix(installer): keep CLAUDE.md encoding'. Got: $TITLE"
            exit 1
          fi
          if ! printf '%s' "$BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+'; then
            echo "::warning::No 'Closes #N' in the description: the issue will not close on merge."
          fi
